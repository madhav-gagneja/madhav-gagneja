<svg viewBox="0 0 1400 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>

    <linearGradient id="lineActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#B366FF"/>
    </linearGradient>

    <radialGradient id="nodeCyan" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#B6F6FF"/>
      <stop offset="55%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#0090C8"/>
    </radialGradient>

    <radialGradient id="nodePurple" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#E3CCFF"/>
      <stop offset="55%" stop-color="#B366FF"/>
      <stop offset="100%" stop-color="#6A2FC9"/>
    </radialGradient>

    <radialGradient id="nodeCurrent" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#00A66A"/>
    </radialGradient>

    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="460" fill="url(#bgGlow)"/>

  <!-- scattered background stars -->
  <g fill="#7FB7D9" opacity="0.55">
    <circle cx="60" cy="60" r="1.4"/><circle cx="140" cy="110" r="1"/>
    <circle cx="230" cy="40" r="1.6"/><circle cx="310" cy="90" r="1"/>
    <circle cx="410" cy="55" r="1.2"/><circle cx="500" cy="30" r="1"/>
    <circle cx="590" cy="75" r="1.5"/><circle cx="680" cy="45" r="1"/>
    <circle cx="770" cy="95" r="1.3"/><circle cx="860" cy="35" r="1"/>
    <circle cx="950" cy="70" r="1.6"/><circle cx="1040" cy="50" r="1"/>
    <circle cx="1130" cy="90" r="1.2"/><circle cx="1220" cy="40" r="1"/>
    <circle cx="1310" cy="65" r="1.4"/><circle cx="1360" cy="105" r="1"/>
    <circle cx="90" cy="400" r="1.3"/><circle cx="200" cy="420" r="1"/>
    <circle cx="330" cy="390" r="1.5"/><circle cx="470" cy="415" r="1"/>
    <circle cx="620" cy="395" r="1.2"/><circle cx="760" cy="420" r="1"/>
    <circle cx="900" cy="400" r="1.4"/><circle cx="1050" cy="415" r="1"/>
    <circle cx="1190" cy="395" r="1.2"/><circle cx="1330" cy="410" r="1"/>
  </g>

  <!-- main constellation spine -->
  <path d="M 130 230 L 400 230 L 670 230 L 940 230 L 1250 230"
        stroke="url(#lineActive)" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 940 230 L 1250 230" stroke="#3A4A63" stroke-width="2"
        stroke-dasharray="4 8" fill="none" opacity="0.7"/>

  <!-- satellite cross-links (constellation feel) -->
  <g stroke="#4A6D8C" stroke-width="1" opacity="0.5">
    <line x1="130" y1="230" x2="180" y2="150"/>
    <line x1="130" y1="230" x2="90" y2="160"/>
    <line x1="400" y1="230" x2="440" y2="140"/>
    <line x1="400" y1="230" x2="350" y2="320"/>
    <line x1="670" y1="230" x2="710" y2="150"/>
    <line x1="670" y1="230" x2="620" y2="320"/>
    <line x1="940" y1="230" x2="980" y2="140"/>
    <line x1="940" y1="230" x2="890" y2="320"/>
    <line x1="1250" y1="230" x2="1290" y2="160"/>
  </g>
  <g fill="#5C87A8" opacity="0.7">
    <circle cx="180" cy="150" r="2.5"/><circle cx="90" cy="160" r="2"/>
    <circle cx="440" cy="140" r="2.5"/><circle cx="350" cy="320" r="2"/>
    <circle cx="710" cy="150" r="2.5"/><circle cx="620" cy="320" r="2"/>
    <circle cx="980" cy="140" r="2.5"/><circle cx="890" cy="320" r="2"/>
    <circle cx="1290" cy="160" r="2" opacity="0.5"/>
  </g>

  <!-- NODE 1 : Foundation -->
  <g filter="url(#glow)">
    <circle cx="130" cy="230" r="14" fill="url(#nodeCyan)"/>
  </g>
  <circle cx="130" cy="230" r="14" fill="none" stroke="#B6F6FF" stroke-width="1" opacity="0.6"/>
  <text x="130" y="280" text-anchor="middle" fill="#E6F1FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Foundation</text>
  <text x="130" y="302" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">Aug 2024 · B.Tech CSE</text>
  <text x="130" y="318" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">AI &amp; ML Specialization</text>

  <!-- NODE 2 : Systems Thinking -->
  <g filter="url(#glow)">
    <circle cx="400" cy="230" r="14" fill="url(#nodeCyan)"/>
  </g>
  <circle cx="400" cy="230" r="14" fill="none" stroke="#B6F6FF" stroke-width="1" opacity="0.6"/>
  <text x="400" y="280" text-anchor="middle" fill="#E6F1FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Leadership</text>
  <text x="400" y="302" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">Dec 2024 – Sep 2025</text>
  <text x="400" y="318" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">Tech Events · CTF · Esports</text>

  <!-- NODE 3 : Multi-Domain Expansion -->
  <g filter="url(#glow)">
    <circle cx="670" cy="230" r="14" fill="url(#nodePurple)"/>
  </g>
  <circle cx="670" cy="230" r="14" fill="none" stroke="#E3CCFF" stroke-width="1" opacity="0.6"/>
  <text x="670" y="280" text-anchor="middle" fill="#E6F1FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Competitive Growth</text>
  <text x="670" y="302" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">10+ National Competitions</text>
  <text x="670" y="318" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">3× Finalist · Hackathons</text>

  <!-- NODE 4 : Current Orbit (active / pulsing) -->
  <g filter="url(#glowStrong)">
    <circle cx="940" cy="230" r="20" fill="url(#nodeCurrent)"/>
  </g>
  <circle cx="940" cy="230" r="20" fill="none" stroke="#00FF9D" stroke-width="1.5" opacity="0.9">
    <animate attributeName="r" values="20;30;20" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="940" cy="230" r="20" fill="none" stroke="#00FF9D" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="20;40;20" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="940" y="285" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="800">Current Orbit</text>
  <text x="940" y="307" text-anchor="middle" fill="#00FF9D" font-family="Arial, sans-serif" font-size="12" font-weight="600">AI Intern @ Graphura</text>
  <text x="940" y="323" text-anchor="middle" fill="#8FB4D9" font-family="Arial, sans-serif" font-size="12">Deloitte &amp; Goldman Sachs Sims</text>
  <rect x="890" y="150" width="100" height="22" rx="11" fill="#0D1117" stroke="#00FF9D" stroke-width="1"/>
  <text x="940" y="165" text-anchor="middle" fill="#00FF9D" font-family="Arial, sans-serif" font-size="11" font-weight="700">● ACTIVE</text>

  <!-- NODE 5 : Next Node (future, dimmed) -->
  <circle cx="1250" cy="230" r="13" fill="none" stroke="#5C6E85" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="1250" y="280" text-anchor="middle" fill="#7C8CA3" font-family="Arial, sans-serif" font-size="16" font-weight="700">Next Node</text>
  <text x="1250" y="302" text-anchor="middle" fill="#5C6E85" font-family="Arial, sans-serif" font-size="12">MADSTUD</text>
  <text x="1250" y="318" text-anchor="middle" fill="#5C6E85" font-family="Arial, sans-serif" font-size="12">future venture</text>

</svg>
