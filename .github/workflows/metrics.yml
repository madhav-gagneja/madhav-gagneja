name: Generate Profile Metrics

# WHY THIS EXISTS:
# github-readme-stats.vercel.app and github-profile-trophy.vercel.app are
# shared public instances used by thousands of profiles. When they hit rate
# limits or get paused (as happened Jan 2026), every README depending on
# them shows broken images — through no fault of the repo owner.
#
# This workflow generates the same information as static SVG files, commits
# them into THIS repo, and the README embeds those local files instead of
# calling an external service. Nothing to go down, nothing to rate-limit.

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate daily at 00:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: madhav-gagneja
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # --- Theming to match the AI Engineering Command Center palette ---
          config_display: large
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          config_theme: dark
